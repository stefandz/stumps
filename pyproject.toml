[project]
name = "stumps"
version = "0.1.0"
description = "A CLI for cricket lovers: prioritised live scores, batting/bowling figures, DLS par scores and a home-grown win-probability indicator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    # Browser TLS-fingerprint impersonation. ESPNcricinfo's CDN blocks standard
    # Python TLS handshakes (403); curl_cffi reproduces Chrome's, which gets the
    # free ESPN open API through. This is the whole reason live data works.
    "curl_cffi>=0.7",
    # Shell tab-completion for --team/--region (register-python-argcomplete).
    "argcomplete>=3.0",
]

[project.optional-dependencies]
# Needed to train the win-probability model from Cricsheet. Inference at runtime
# falls back to a pure-Python heuristic when these (and a trained model) are absent.
winprob = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stumps = "stumps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stumps = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
